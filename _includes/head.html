<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="keywords" content="Systems Engineer, DevOps, {{ site.title }}">
<meta name="author" content="{{ site.title }}">

<!-- OpenGraph / Social Media Meta Tags -->
<meta property="og:type" content="website">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:image" content="{{ site.url }}{{ site.background | relative_url }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="{{ site.title }}">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | default: site.title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">
<meta name="twitter:image" content="{{ site.url }}{{ site.background | relative_url }}">
<meta name="twitter:creator" content="@{{ site.twitter }}">

<!-- Favicon -->
<link rel="icon" href="{{ site.favicon | relative_url }}" type="image/x-icon">

<!-- Canonical URL -->
<link rel="canonical" href="{{ page.url | absolute_url }}">

<!-- Preload critical assets -->
<link rel="preload" href="{{ site.avatar | relative_url }}" as="image">
<link rel="preload" href="{{ site.background | relative_url }}" as="image">

<!-- Responsive design and performance -->
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="theme-color" content="#005fcc">

<!-- JSON-LD Schema Markup -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ site.title }}",
  "url": "{{ site.url }}",
  "image": "{{ site.url }}{{ site.avatar | relative_url }}",
  "sameAs": [
    "https://github.com/{{ site.github-user }}",
    "https://twitter.com/{{ site.twitter }}",
    "https://linkedin.com/in/{{ site.linkedin }}"
  ],
  "jobTitle": "{{ site.description }}",
  "worksFor": {
    "@type": "Organization",
    "name": "Self-employed"
  }
}
</script>

<!-- CSS with media query for responsive loading -->
<link rel="stylesheet" href="/assets/css/main.css" media="all">
<link rel="stylesheet" href="/assets/css/accessibility.css" media="all">

<!-- Skip to content link for accessibility -->
<a class="skip-link" href="#main-content">Skip to main content</a>
